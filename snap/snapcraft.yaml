name: arrowescape
adopt-info: arrowescape
license: GPL-3.0-or-later # the licensing module has its own licence: LICENSING.md

grade: stable
confinement: strict
base: core24
compression: lzo

icon: snap/gui/icon.png

platforms:
  amd64:
  arm64:

apps:
  arrowescape:
    command: usr/bin/arrowescape
    desktop: usr/share/applications/com.ktechpit.arrowescape.desktop
    common-id: com.ktechpit.arrowescape
    extensions:
      - kde-neon-6
    environment:
      IS_SNAP: '1'
    plugs:
      - opengl
      - wayland
      - x11
      - desktop
      - desktop-legacy
      - network         # licence status check (ktechpit USS)
      # Music + sound effects are looping SoundEffects (QAudioSink) — no
      # MediaPlayer/ffmpeg — so only the audio-output service is needed.
      - audio-playback
      - alsa

parts:
  arrowescape:
    source: .
    plugin: cmake
    # Pull summary / description / licence from the bundled AppStream metainfo.
    parse-info:
      - usr/share/metainfo/com.ktechpit.arrowescape.metainfo.xml
    build-packages:
      - git # the version names the commit
      - libxkbcommon-dev
      - libpulse-dev
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/usr
    override-build: |
      craftctl default
      # The version comes from the CMake project. A build that is not exactly a version tag
      # (edge) carries the commit: 2.0.0+git1a2b3c4.
      VER=$(grep -m1 '^CMAKE_PROJECT_VERSION:STATIC=' "${CRAFT_PART_BUILD}/CMakeCache.txt" | cut -d= -f2 | tr -d '[:space:]')
      if ! git -c safe.directory="*" -C "${CRAFT_PART_SRC}" describe --exact-match --tags --match "v${VER}" >/dev/null 2>&1; then
        HASH=$(git -c safe.directory="*" -C "${CRAFT_PART_SRC}" rev-parse --short=7 HEAD 2>/dev/null || true)
        [ -n "${HASH}" ] && VER="${VER}+git${HASH}"
      fi
      craftctl set version="${VER}"

      # Point the desktop entry at the snap's packaged icon.
      sed -i \
        "s|^Icon=.*|Icon=\${SNAP}/meta/gui/icon.png|" \
        ${CRAFT_PART_INSTALL}/usr/share/applications/com.ktechpit.arrowescape.desktop
    prime:
      - -usr/include
      - -usr/lib/*/cmake
      - -usr/share/man
      - -usr/share/lintian
