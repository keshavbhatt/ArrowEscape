version = 1
SPDX-PackageName = "ArrowEscape"
SPDX-PackageSupplier = "Keshav Bhatt <connect@ktechpit.com>"
SPDX-PackageDownloadLocation = "https://github.com/keshavbhatt/ArrowEscape"

# Everything is GPL-3.0-or-later except the licensing module below.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Keshav Bhatt (Ktechpit)"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The licensing module: account, licence, evaluation-period and Pro verification code.
[[annotations]]
path = [
    "modules/AccountAndLicense/**",
    "src/licensing/**"
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Keshav Bhatt (Ktechpit)"
SPDX-License-Identifier = "LicenseRef-Ktechpit-Licensing-Module"
